databaseChangeLog:

  - changeSet:
      id: 1
      author: Harsh
      changes:
        - createTable:
            tableName: test_liquibase
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(100)

  - changeSet:
      id: 2
      author: Harsh
      changes:
        - addColumn:
            tableName: test_liquibase
            columns:
              - column:
                  name: email
                  type: VARCHAR(150)

